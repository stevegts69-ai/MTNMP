<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset Password | Metabolic Nuclear Medicine Platform</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1f2937;
        background: #f3f7f8;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      main {
        width: min(100%, 420px);
        padding: 32px;
        background: #ffffff;
        border: 1px solid #d9e3e5;
        border-radius: 12px;
        box-shadow: 0 12px 30px rgb(31 41 55 / 8%);
      }

      h1 {
        margin: 0 0 8px;
        color: #0f5c68;
        font-size: 1.5rem;
      }

      p {
        line-height: 1.5;
      }

      label {
        display: block;
        margin-top: 16px;
        margin-bottom: 6px;
        font-size: 0.9rem;
        font-weight: 600;
      }

      input,
      button {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        border-radius: 6px;
        font: inherit;
      }

      input {
        border: 1px solid #b8c8cc;
      }

      button {
        margin-top: 24px;
        border: 0;
        color: #ffffff;
        background: #0f5c68;
        cursor: pointer;
        font-weight: 600;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #status {
        display: none;
        margin: 16px 0 0;
        padding: 12px;
        border-radius: 6px;
      }

      #status.error {
        display: block;
        color: #8b1e2d;
        background: #fdecef;
      }

      #status.success {
        display: block;
        color: #166534;
        background: #ecfdf3;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Reset your password</h1>
      <p>Choose a new password for your institution account.</p>

      <form id="reset-form">
        <label for="new-password">New password</label>
        <input id="new-password" type="password" minlength="8" required autocomplete="new-password" />

        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" type="password" minlength="8" required autocomplete="new-password" />

        <button id="submit-button" type="submit">Update password</button>
      </form>

      <p id="status" role="alert" aria-live="polite"></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = "https://modfrkldfokqqxllypdz.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_y2kX5Z8YngTRjbhoBqt3Ww_6FBLvNFh";
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const form = document.getElementById("reset-form");
      const status = document.getElementById("status");
      const submitButton = document.getElementById("submit-button");
      let recoverySession = null;

      function renderStatus(message, type) {
        status.textContent = message;
        status.className = type;
      }

      supabase.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY") {
          recoverySession = session;
          renderStatus("Enter a new password below.", "success");
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const newPassword = document.getElementById("new-password").value;
        const confirmPassword = document.getElementById("confirm-password").value;

        if (newPassword !== confirmPassword) {
          renderStatus("Passwords do not match.", "error");
          return;
        }

        submitButton.disabled = true;
        renderStatus("Updating your password...", "success");

        try {
          const { error } = await supabase.auth.updateUser({ password: newPassword });
          if (error) {
            renderStatus(error.message, "error");
            return;
          }

          form.hidden = true;
          status.textContent =
            "Password reset successfully! You can now log into the app with your new password.";
          status.className = "success";
        } catch (error) {
          const message =
            error instanceof Error ? error.message : "Unable to update your password.";
          renderStatus(message, "error");
        } finally {
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
